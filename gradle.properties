# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process, including headless mode for CI.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true

# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Set the maximum number of workers to 4 to avoid overloading the machine.
org.gradle.workers.max=4

# Use daemon strategy instead of in-process to prevent KSP IntelliJ AWT null pointer crashes in CI.
kotlin.compiler.execution.strategy=daemon

# AGP 9's built-in Kotlin support disallows plugins that wire generated sources via the
# kotlin.sourceSets DSL (as KSP still does as of KSP 2.2.10-2.0.2), which otherwise fails
# configuration with "Using kotlin.sourceSets DSL to add Kotlin sources is not allowed with
# built-in Kotlin." See https://github.com/google/ksp/issues/2729.
android.disallowKotlinSourceSets=false

# Allow the google-services plugin to work even if google-services.json is not present.
googleServices.missing.passthrough=true
